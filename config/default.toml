[app]
name = "auto-comfy-maker"
log_level = "info"

[prompt]
default_lang = "zh"
default_strategy = "comma"
default_max_length = 800
default_seed = 0

[comfyui]
url = "http://127.0.0.1:8188"
poll_interval_secs = 2
timeout_secs = 300

[llm]
enabled = false
provider = "openai"        # openai | anthropic
model = "gpt-4o-mini"
api_key = ""               # 也可读环境变量 OPENAI_API_KEY / ANTHROPIC_API_KEY
base_url = ""              # 可选
disable_thinking = false   # true 时向 provider 传 enable_thinking=false（DashScope/Qwen 推荐）

[paths]
themes_dir = "themes"
tags_dir = "tags"
output_dir = "output"
logs_dir = "logs"
templates_dir = "templates"
