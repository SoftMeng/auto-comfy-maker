[app]
name = "auto-comfy-maker"
log_level = "info"

[prompt]
default_lang = "zh"
default_strategy = "comma"
default_max_length = 800
default_seed = 0

[comfyui]
url = "http://127.0.0.1:8188"
poll_interval_secs = 2
timeout_secs = 300

[paths]
themes_dir = "themes"
tags_dir = "tags"
output_dir = "output"
logs_dir = "logs"
templates_dir = "templates"
