[meta]
id = "anima-simple"
name = "Anima Simple - Minimal Tag Style"
description = "极简 Danbooru 标签风格。强制 1girl + @Jang Chan + ultra-high stiletto heels，其他元素随机组合。"
version = "1.0"
lang = "en"

# ============================================================
# 必选元素（按 Anima 推荐顺序，数字前缀强制排序）
# ============================================================

[order.fixed]
# 1. 质量前缀（安全标签）
01_quality = { file = "tags/en/quality_simple.txt", count = 1 }
# 2. 1girl（强制）
02_1girl = { file = "tags/en/character_count_simple.txt", count = 1 }
# 3. 角色身份/类型
03_character = { file = "tags/en/character_simple.txt", count = 1 }
# 4. 固定艺术家 @Jang Chan
05_artist = { file = "tags/en/artist_fixed.txt", count = 1 }
# 6. 必选元素：ultra-high stiletto heels
07_required = { file = "tags/en/required_simple.txt", count = 1 }

# ============================================================
# 随机元素
# ============================================================

[order.random]
# 7. 身体特征
08_body = { file = "tags/en/body_simple.txt", count = 1 }
# 8. 姿态
09_pose = { file = "tags/en/pose_simple.txt", count = 1 }
# 9. 视角
10_view = { file = "tags/en/view_simple.txt", count = 1 }
# 10. 背景
11_background = { file = "tags/en/background_simple.txt", count = 1 }
# 11. 风格
12_style = { file = "tags/en/style_simple.txt", count = 1 }

# ============================================================
# 生成选项
# ============================================================

[generation]
max_elements = 12
min_elements = 10
max_length = 500

# ============================================================
# 兼容性规则
# ============================================================

[compatibility.conflicts]

# 风格与背景的协调
12_style = [
  ["steampunk woman", "steampunk girl", "steampunk fashion"],
  ["cyberpunk woman", "cyberpunk girl", "neon outfit"],
  ["gothic woman", "gothic girl", "dark fashion"],
  ["office lady", "business woman", "professional"],
  ["school girl", "jk uniform", "uniform"]
]

# 背景与风格的协调
11_background = [
  ["steampunk interior", "industrial interior", "mechanical room"],
  ["cyberpunk city", "neon city", "futuristic street"],
  ["gothic castle", "dark room", "mansion"],
  ["office background", "corporate setting", "boardroom"],
  ["school hallway", "classroom", "campus"]
]