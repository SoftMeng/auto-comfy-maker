# ============================================================
# 人像主题（portrait）
# ============================================================

[meta]
id = "portrait"
name = "人像主题"
description = "适合单人物人像生成；混合语言模式建议同时启用 LLM refine"
lang = "zh"
version = "1.0"

# ============================================================
# 必选元素（按固定顺序，出现在 prompt 开头）
# ============================================================

[order.fixed]
style = { file = "tags/zh/风格.txt", count = 1 }
subject = { file = "tags/zh/主体.txt", count = 1 }

# ============================================================
# 随机元素（按主题声明的优先级）
# ============================================================

[order.random]
# 高优先级：保持类目顺序
camera = { file = "tags/zh/构图.txt", count = 1 }

# ============================================================
# 可选元素（按 probability 出现）
# ============================================================

[order.optional]
# 当前 tags/ 目录未提供，可后续添加：
# scene = { file = "tags/zh/场景.txt", probability = 0.7 }
# lighting = { file = "tags/zh/光线.txt", probability = 0.5 }

# ============================================================
# 生成选项
# ============================================================

[generation]
max_elements = 30
max_length = 800