[meta]
id = "anima-drawing-v5"
name = "Anima Drawing v5 - Original Asian Female Character"
description = "原创亚洲女性角色设计，使用 Anima 官方推荐的 Danbooru 标签格式。"
version = "5.0"
lang = "en"

# ============================================================
# 字段名前缀（按 Anima 推荐顺序强制排序）：
#   01_quality        = 质量前缀（masterpiece, best quality...）
#   02_1girl          = 1girl, solo
#   03_character      = archetype (角色身份)
#   04_series         = series (可空)
#   05_artist         = 艺术家 (@xxx)
#   06_era            = 时代
#   07_clothing       = 服装
#   08_background     = 背景
#   09_hair           = 头发
#   10_pose           = 姿态
# ============================================================

# ============================================================
# 必选元素（Anima 推荐顺序）
# ============================================================

[order.fixed]
# 1. 质量前缀
01_quality = { file = "tags/en/quality.txt", count = 1 }
# 2. 1girl, solo
02_1girl = { file = "tags/en/character_count.txt", count = 1 }
# 6. 时代
06_era = { file = "tags/en/era_only.txt", count = 1 }
# 7. 服装
07_clothing = { file = "tags/en/clothing.txt", count = 1 }
# 8. 背景
08_background = { file = "tags/en/background.txt", count = 1 }

# ============================================================
# 随机元素
# ============================================================

[order.random]
# 3. 角色身份
03_character = { file = "tags/en/archetype.txt", count = 1 }
# 5. 艺术家
05_artist = { file = "tags/en/artists.txt", count = 1 }
# 9. 头发
09_hair = { file = "tags/en/hairstyle.txt", count = 1 }
# 10. 姿态
10_pose = { file = "tags/en/pose.txt", count = 1 }

# ============================================================
# 生成选项
# ============================================================

[generation]
max_elements = 10
min_elements = 8
max_length = 800

# ============================================================
# 兼容性规则
# ============================================================

[compatibility.conflicts]

